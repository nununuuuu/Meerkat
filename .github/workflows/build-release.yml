name: Build and Release APK

on:
  push:
    branches: [ main ]
    paths:
      - "ResourceSniffer-v0.2-source.zip"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract source
        run: unzip -q ResourceSniffer-v0.2-source.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/ResourceSniffer-v0.2
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp build-src/ResourceSniffer-v0.2/app/build/outputs/apk/debug/app-debug.apk Meerkat-v0.2.0-debug.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.2.0 --yes || true
          git push origin :refs/tags/v0.2.0 || true
          gh release create v0.2.0 Meerkat-v0.2.0-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "Meerkat v0.2.0" \
            --notes "ResourceSniffer v0.2 development build. Includes VPN/TUN capture metadata, DNS host mapping, TLS SNI detection, app attribution, and overlay UI. TCP/UDP forwarding is not yet implemented, so this is a development milestone rather than an always-on production sniffer."
