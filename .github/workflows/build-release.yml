name: Build and Release APK

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Meerkat-v0.3.0-debug.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.0 --yes || true
          git push origin :refs/tags/v0.3.0 || true
          gh release create v0.3.0 Meerkat-v0.3.0-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "Meerkat v0.3.0" \
            --notes "Meerkat v0.3.0：介面改為繁體中文，預設停用會造成斷網的未完成 VPN 模式，新增內建 WebView 資源嗅探，只列出圖片、影片、音訊、文件、HLS/DASH 與壓縮檔，並支援複製網址與下載。"
