name: Build APK

on:
  push:
    branches: [ main, "rebuild/mobile-parity" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          "$SDKMANAGER" "platforms;android-37.2"

      - name: Build gVisor netstack bridge
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --depth 1 https://github.com/IEAmir/NetValve.git /tmp/netvalve
          cd /tmp/netvalve/netstack
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          chmod +x build-aar.sh
          ./build-aar.sh arm64
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ../app/libs/netstack.aar "$GITHUB_WORKSPACE/app/libs/netstack.aar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release asset
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Meerkat-v0.6.0-beta1-debug.apk
          sha256sum Meerkat-v0.6.0-beta1-debug.apk > Meerkat-v0.6.0-beta1-debug.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meerkat-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish v0.6.0-beta1
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Meerkat v0.6.0-beta1 rebuilds the app around a mobile resource-sniffing core instead of the old Gecko/Cat Catch runtime.

          Core capture:
          - Built-in browser capture: requests, DOM/dynamic DOM, fetch, XHR, WebSocket, Performance API, Worker/ServiceWorker, MSE and Blob resources.
          - External-app capture through an on-device VPN + optional local CA HTTPS MITM.
          - QUIC/HTTP3 downgrade to inspectable TCP where the client supports fallback.
          - HTTP/1.1 framing, keep-alive, chunked bodies, redirects, compressed text response decoding and deep URL search.
          - Resource classification for images, video, audio, PDF/EPUB, Word, Excel, PowerPoint, OpenDocument, text files and archives.
          - Short-lived resource response snapshots so expiring URLs can still be saved after capture.

          Streaming:
          - HLS master/nested master, variants, external audio/subtitle groups, AES-128, byte ranges, fMP4 init segments, VOD and live recording.
          - Single-track and dual-track HLS live recording with playlist refresh and muxing.
          - DASH SegmentTemplate, SegmentTimeline, SegmentList, SegmentBase/SIDX byte ranges, BaseURL inheritance, subtitles, Multi-Period and dynamic MPD recording.
          - DRM/CENC is detected and not decrypted.

          Downloads:
          - Authenticated replay with Cookie/Referer/User-Agent.
          - Original Content-Disposition filenames and MIME preservation.
          - Retry, safe ETag/Last-Modified If-Range resume and parallel ranged downloads for large direct files.
          - Batch selection/download and current-session filtering.

          Android platform limitation:
          Apps that reject user-installed CAs or use certificate pinning cannot be transparently decrypted without root/hooking. Those connections are bypassed rather than deliberately breaking the target app.
          EOF

          gh release create v0.6.0-beta1             Meerkat-v0.6.0-beta1-debug.apk             Meerkat-v0.6.0-beta1-debug.apk.sha256             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Meerkat v0.6.0-beta1"             --prerelease             --notes-file release-notes.md
