name: Build and Release APK

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"

      - name: Build gVisor netstack bridge
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --depth 1 https://github.com/IEAmir/NetValve.git /tmp/netvalve
          cd /tmp/netvalve/netstack
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          chmod +x build-aar.sh
          ./build-aar.sh arm64
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ../app/libs/netstack.aar "$GITHUB_WORKSPACE/app/libs/netstack.aar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Meerkat-v0.5.0-beta1-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meerkat-v0.5.0-beta1-debug
          path: Meerkat-v0.5.0-beta1-debug.apk
          if-no-files-found: error

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.5.0-beta1 --yes || true
          git push origin :refs/tags/v0.5.0-beta1 || true
          gh release create v0.5.0-beta1 Meerkat-v0.5.0-beta1-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Meerkat v0.5.0-beta1" \
            --prerelease \
            --notes "測試版：內建瀏覽器改為主要資源嗅探流程；即時顯示圖片與影片數量；加強 DOM 深度掃描（srcset、picture、video/audio source、poster、Open Graph、CSS background-image、Performance Resource）；改善分享文字網址擷取；媒體去重優先保留高解析度/較大版本；資源列表改為影片與圖片優先；外部 App VPN 從主導覽移除。"
