name: Build APK

on:
  push:
    branches: [ main, "rebuild/mobile-parity" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          "$SDKMANAGER" "platforms;android-37.2"

      - name: Build gVisor netstack bridge
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --depth 1 https://github.com/IEAmir/NetValve.git /tmp/netvalve
          cd /tmp/netvalve/netstack
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          chmod +x build-aar.sh
          ./build-aar.sh arm64
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ../app/libs/netstack.aar "$GITHUB_WORKSPACE/app/libs/netstack.aar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release asset
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Meerkat-v0.6.0-beta3-debug.apk
          sha256sum Meerkat-v0.6.0-beta3-debug.apk > Meerkat-v0.6.0-beta3-debug.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meerkat-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish v0.6.0-beta3
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Meerkat v0.6.0-beta3

          Changes since beta2:
          - Fixed global capture lifecycle so the VPN capture session remains alive outside Meerkat.
          - Kept browser capture and global capture state independent to avoid UI/session conflicts.
          - Improved global capture network compatibility with active-network DNS preservation, QUIC pass-through, and safer HTTP/2 handling.
          - Fixed HTTPS MITM protocol symmetry to reduce breakage in captured apps.
          - Reworked the built-in browser interaction so pages can scroll and receive input normally while sniffing.
          - Reduced the top resource panel footprint and kept the resource categories as lightweight filters rather than oversized controls.
          - Improved detected resource labels so entries show meaningful names instead of only file sizes where possible.
          - Switched video preview playback to Media3 and repaired preview controls/content rendering.
          - Kept the floating counter and panel synchronized with the same live capture session.
          - Removed the obsolete app-list permission from global capture.

          Notes:
          - Apps that reject user-installed CAs or use certificate pinning may still be opaque to HTTPS MITM without root/hooking.
          - DRM/CENC content is detected but not decrypted.
          EOF

          gh release create v0.6.0-beta3             Meerkat-v0.6.0-beta3-debug.apk             Meerkat-v0.6.0-beta3-debug.apk.sha256             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Meerkat v0.6.0-beta3"             --prerelease             --notes-file release-notes.md
