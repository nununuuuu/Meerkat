name: Build APK

on:
  push:
    branches: [ main, "rebuild/mobile-parity", "fix/**" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          "$SDKMANAGER" "platforms;android-37.2"

      - name: Build gVisor netstack bridge
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --depth 1 https://github.com/IEAmir/NetValve.git /tmp/netvalve
          cd /tmp/netvalve/netstack
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          chmod +x build-aar.sh
          ./build-aar.sh arm64
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ../app/libs/netstack.aar "$GITHUB_WORKSPACE/app/libs/netstack.aar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meerkat-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish beta6 Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Meerkat-v0.6.0-beta6-debug.apk
          cd release-assets
          sha256sum Meerkat-v0.6.0-beta6-debug.apk > Meerkat-v0.6.0-beta6-debug.apk.sha256
          cat > notes.md <<'NOTES'
          Meerkat v0.6.0-beta6

          - Improved CA detection using both the certificate store and configured trust managers. An unreadable store entry no longer stops the scan.
          - Added explicit confirmation when the current exported CA is installed but automatic detection fails. Confirmation is tied to the current CA fingerprint; restart capture after confirming.
          - Removed the CA gate from the HTTP/3 compatibility switch and enabled toggling while capture runs.
          - Moved the floating-ball on/off switch to the App tab, independently of starting/stopping capture.
          - Centered resource category labels and counts in separate rows.
          - Added a Home button beside Reload to return to the empty browser start screen without deleting captured resources.
          - Adopted a fixed development signing identity so future beta upgrades preserve app-local CA keys and history.

          Validation: JVM tests and APK build passed before publishing this APK.

          Installation: older betas used ephemeral CI debug signatures. If Android reports a signature conflict, a one-time reinstall may be necessary; export/install the new CA afterward. Future builds using this development identity can update in place.

          A user-installed CA still does not bypass another app's certificate pinning or trust restrictions. HTTP/3 is not decrypted; the compatibility option tries TCP fallback.
          NOTES
          if gh release view v0.6.0-beta6 >/dev/null 2>&1; then
            echo 'beta6 is already published; leaving its assets unchanged.'
          else
            gh release create v0.6.0-beta6 Meerkat-v0.6.0-beta6-debug.apk Meerkat-v0.6.0-beta6-debug.apk.sha256 --target "$GITHUB_SHA" --title 'Meerkat v0.6.0-beta6' --prerelease --notes-file notes.md
          fi
