name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          "$SDKMANAGER" "platforms;android-37.2"

      - name: Vendor Cat Catch 2.7.2
        run: |
          rm -rf /tmp/cat-catch app/src/main/assets/catcatch
          git clone https://github.com/xifangczy/cat-catch.git /tmp/cat-catch
          cd /tmp/cat-catch
          git checkout 8cdde7c32fd5bd8d367f861dad86702a8daa13b1
          rm -rf .git .github
          cp manifest.firefox.json manifest.json
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/catcatch"
          cp -a . "$GITHUB_WORKSPACE/app/src/main/assets/catcatch/"

      - name: Build gVisor netstack bridge
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --depth 1 https://github.com/IEAmir/NetValve.git /tmp/netvalve
          cd /tmp/netvalve/netstack
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          chmod +x build-aar.sh
          ./build-aar.sh arm64
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ../app/libs/netstack.aar "$GITHUB_WORKSPACE/app/libs/netstack.aar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Meerkat-v0.5.0-beta3-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meerkat-v0.5.0-beta3-debug
          path: Meerkat-v0.5.0-beta3-debug.apk
          if-no-files-found: error

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.5.0-beta3 --yes || true
          git push origin :refs/tags/v0.5.0-beta3 || true
          gh release create v0.5.0-beta3 Meerkat-v0.5.0-beta3-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Meerkat v0.5.0-beta3" \
            --prerelease \
            --notes "Gecko + Cat Catch PoC 測試版。新增 GeckoView 瀏覽器與 Cat Catch 2.7.2 WebExtension 實驗入口，用於驗證圖片、影片、m3u8/MPD 等資源嗅探能力。保留原 Meerkat WebView 功能。Cat Catch 來源：xifangczy/cat-catch commit 8cdde7c32fd5bd8d367f861dad86702a8daa13b1，授權 GPL-3.0。GeckoView 固定為 159.0.20260927205153。"
